<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变：从深红到金色，传达喜悦与财富感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#CC0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6600;stop-opacity:1" />
    </linearGradient>
    
    <!-- 上涨线条渐变 -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFEC80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- 箭头渐变 -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFACD;stop-opacity:1" />
    </linearGradient>
    
    <!-- 光泽效果 -->
    <radialGradient id="shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- 圆角矩形裁剪 -->
    <clipPath id="roundClip">
      <rect x="56" y="56" width="400" height="400" rx="80" ry="80" />
    </clipPath>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 外圈阴影 -->
  <rect x="48" y="52" width="416" height="416" rx="84" ry="84" fill="#00000030" />
  
  <!-- 主背景圆角矩形 -->
  <rect x="56" y="56" width="400" height="400" rx="80" ry="80" fill="url(#bgGrad)" />
  
  <!-- 背景光泽 -->
  <rect x="56" y="56" width="400" height="400" rx="80" ry="80" fill="url(#shine)" />
  
  <!-- 装饰性网格点（科技感） -->
  <g opacity="0.12">
    <circle cx="120" cy="120" r="3" fill="#FFF"/>
    <circle cx="180" cy="120" r="3" fill="#FFF"/>
    <circle cx="240" cy="120" r="3" fill="#FFF"/>
    <circle cx="300" cy="120" r="3" fill="#FFF"/>
    <circle cx="360" cy="120" r="3" fill="#FFF"/>
    <circle cx="120" cy="180" r="3" fill="#FFF"/>
    <circle cx="180" cy="180" r="3" fill="#FFF"/>
    <circle cx="240" cy="180" r="3" fill="#FFF"/>
    <circle cx="300" cy="180" r="3" fill="#FFF"/>
    <circle cx="360" cy="180" r="3" fill="#FFF"/>
    <circle cx="120" cy="240" r="3" fill="#FFF"/>
    <circle cx="180" cy="240" r="3" fill="#FFF"/>
    <circle cx="240" cy="240" r="3" fill="#FFF"/>
    <circle cx="300" cy="240" r="3" fill="#FFF"/>
    <circle cx="360" cy="240" r="3" fill="#FFF"/>
    <circle cx="120" cy="300" r="3" fill="#FFF"/>
    <circle cx="180" cy="300" r="3" fill="#FFF"/>
    <circle cx="240" cy="300" r="3" fill="#FFF"/>
    <circle cx="300" cy="300" r="3" fill="#FFF"/>
    <circle cx="360" cy="300" r="3" fill="#FFF"/>
  </g>
  
  <!-- 上涨折线 - 主体，带发光 -->
  <g filter="url(#glow)">
    <polyline 
      points="100,370 160,310 200,340 260,240 300,260 380,140" 
      fill="none" 
      stroke="url(#lineGrad)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round" />
  </g>
  
  <!-- 折线高光层（更细的亮线） -->
  <polyline 
    points="100,370 160,310 200,340 260,240 300,260 380,140" 
    fill="none" 
    stroke="#FFFFFF80" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round" />
  
  <!-- 上涨箭头头部 -->
  <g filter="url(#softGlow)">
    <polygon 
      points="395,125 355,140 375,165 395,125" 
      fill="url(#arrowGrad)" 
      stroke="#FFD700" 
      stroke-width="2" />
  </g>
  
  <!-- 折线上的数据点（节点） -->
  <circle cx="160" cy="310" r="7" fill="#FFD700" stroke="#FFF" stroke-width="2" />
  <circle cx="260" cy="240" r="7" fill="#FFD700" stroke="#FFF" stroke-width="2" />
  <circle cx="380" cy="140" r="7" fill="#FFD700" stroke="#FFF" stroke-width="2" />
  
  <!-- 底部柱子（K线感） -->
  <g opacity="0.3">
    <rect x="105" y="385" width="16" height="25" rx="3" fill="#FFD700" />
    <rect x="145" y="370" width="16" height="40" rx="3" fill="#FFD700" />
    <rect x="185" y="380" width="16" height="30" rx="3" fill="#FFD700" />
    <rect x="225" y="350" width="16" height="60" rx="3" fill="#FFD700" />
    <rect x="265" y="365" width="16" height="45" rx="3" fill="#FFD700" />
    <rect x="305" y="330" width="16" height="80" rx="3" fill="#FFD700" />
    <rect x="345" y="310" width="16" height="100" rx="3" fill="#FFD700" />
  </g>
  
  <!-- 喜悦符号 - 右上角笑脸元素 -->
  <g transform="translate(390, 100)" opacity="0.9">
    <!-- 笑脸圆圈 -->
    <circle cx="0" cy="0" r="28" fill="#FFD700" opacity="0.25" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.6" />
    <!-- 眼睛 -->
    <circle cx="-7" cy="-5" r="3.5" fill="#FFF" />
    <circle cx="7" cy="-5" r="3.5" fill="#FFF" />
    <!-- 微笑 -->
    <path d="M-10,5 Q0,16 10,5" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" />
  </g>
  
  <!-- 喜悦符号 - 左上角 -->
  <g transform="translate(120, 130)" opacity="0.7">
    <circle cx="0" cy="0" r="18" fill="#FFD700" opacity="0.2" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FFD700" stroke-width="2.5" opacity="0.5" />
    <circle cx="-4.5" cy="-3" r="2.5" fill="#FFF" />
    <circle cx="4.5" cy="-3" r="2.5" fill="#FFF" />
    <path d="M-6,4 Q0,12 6,4" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- 上升的小箭头装饰 -->
  <g opacity="0.4">
    <path d="M330,200 L340,185 L350,200" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round" />
    <path d="M350,215 L360,200 L370,215" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- 闪光粒子 -->
  <g filter="url(#softGlow)">
    <circle cx="200" cy="200" r="4" fill="#FFF" opacity="0.6" />
    <circle cx="320" cy="150" r="3" fill="#FFF" opacity="0.5" />
    <circle cx="280" cy="300" r="3" fill="#FFF" opacity="0.4" />
    <circle cx="150" cy="250" r="2.5" fill="#FFF" opacity="0.5" />
    <circle cx="350" cy="250" r="2.5" fill="#FFF" opacity="0.45" />
  </g>
  
  <!-- 内边框光晕 -->
  <rect x="56" y="56" width="400" height="400" rx="80" ry="80" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.4" />
  <rect x="68" y="68" width="376" height="376" rx="68" ry="68" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" />
</svg>